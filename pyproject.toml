[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnmon"
version = "0.1.0.dev0"
description = "Vulnerability intelligence and correlation engine"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
vulnctl = "vulnmon.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"vulnmon.correlatord.persistence" = ["migrations/*.sql"]
